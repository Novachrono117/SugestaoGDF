<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Sem conexão — Voz DF</title>
    <!-- Página autossuficiente (sem JS nem CSS externo): é servida pelo service worker sem rede. -->
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 16px; font-weight: 700; font-size: 1.125rem; color: #1e40af; }
      main { max-width: 36rem; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { line-height: 1.5; color: #334155; }
      a.botao { display: inline-flex; min-height: 44px; align-items: center; padding: 8px 16px; border-radius: 8px; background: #1d4ed8; color: #fff; font-weight: 600; text-decoration: none; }
      a.botao:focus-visible { outline: 3px solid #1e3a8a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>Voz DF</header>
    <main>
      <h1>Você está sem internet</h1>
      <p>Esta página precisa de conexão para abrir.</p>
      <p>
        Se você estava fazendo uma denúncia, o que já tinha preenchido ficou salvo neste aparelho
        (menos as fotos). Quando a internet voltar, abra “Fazer denúncia” para continuar e enviar.
      </p>
      <p><a class="botao" href="">Tentar de novo</a></p>
    </main>
  </body>
</html>
