# Serviços de apoio para DESENVOLVIMENTO (o app roda fora do Docker, com `npm run dev`).
#   docker compose up -d      → sobe Postgres e Mailpit
#   docker compose down       → para (os dados do Postgres ficam no volume)
# Credenciais vêm do .env (ver .env.example) — são locais, só para este container.
name: voz-df

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-vozdf}
    ports:
      # Só localhost: o banco não fica exposto na rede. POSTGRES_PORTA muda a porta do host quando a 5432
      # já está em uso por outro projeto (ajuste a DATABASE_URL junto).
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP falso: captura os e-mails do app e mostra em http://localhost:8025 (nada sai para a internet).
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # interface web

volumes:
  postgres-dados:
